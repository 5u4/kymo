<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kymo · Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f5; --panel:#fff; --line:#e6e6e2; --line2:#efefec; --hover:#f3f3f0; --sel:#ecebfd; --selbar:#5b5bd6;
  --text:#1c1c1a; --muted:#6c6c66; --faint:#9a9a93; --accent:#5b5bd6; --accent-ink:#fff;
  --run:#2f6fe4; --run-bg:#e8f0fe; --sus:#b7791f; --sus-bg:#fdf3e1; --ok:#1f8a4c; --ok-bg:#e5f5ec;
  --bad:#d23f3f; --bad-bg:#fdecec; --int:#6c6c66; --int-bg:#efefec;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif; --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.45 var(--sans);color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
kbd{font:500 10.5px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted);background:#fff}

/* top bar */
.top{height:40px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.logo i{width:14px;height:14px;border-radius:4px;background:var(--accent);display:inline-block;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.srv{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;min-width:0;white-space:nowrap;overflow:hidden}
.srv .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.srv.down .dot{background:var(--bad)} .srv.down b{color:var(--bad)}
.srv b{font-weight:500;color:var(--text)}
.top .sp{flex:1}
.hint{color:var(--faint);font-size:11.5px;display:flex;gap:10px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:#fff;font-weight:500;font-size:12.5px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)} .btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.navi:focus-visible,.row:focus-visible,.jrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* panes */
.panes{flex:1;display:grid;grid-template-columns:232px 400px minmax(0,1fr);min-height:0}
.pane{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel)}
.pane:last-child{border-right:0;background:var(--bg)}
.phead{flex:none;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line)}
.phead h2{font-size:13px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;overflow:auto;min-height:0}
.back{display:none;font-size:12.5px;color:var(--accent);font-weight:500;padding:4px 6px 4px 0}

/* nav */
#nav .scroll{padding:8px 8px 16px}
.sect{font-size:11px;font-weight:500;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:14px 8px 5px}
.navi{width:100%;display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;text-align:left;position:relative;min-height:30px}
.navi:hover{background:var(--hover)}
.navi[aria-current="true"]{background:var(--sel);font-weight:500}
.navi .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navi .n{font:500 11.5px var(--mono);color:var(--muted)}
.navi .n.hot{color:#fff;background:var(--bad);border-radius:9px;padding:0 6px}
.navi .n.warm{color:var(--sus);background:var(--sus-bg);border-radius:9px;padding:0 6px}
.wfi{position:relative}
.wfi .exe{position:absolute;right:6px;top:3px;height:24px;padding:0 8px;font-size:11.5px;display:none}
.wfi:hover .exe,.wfi:focus-within .exe{display:inline-flex}
.wfi:hover .navi .n,.wfi:focus-within .navi .n{visibility:hidden}

/* status */
.si{width:14px;height:14px;flex:none;display:inline-block}
.s-running{color:var(--run)} .s-suspended{color:var(--sus)} .s-succeeded{color:var(--ok)} .s-failed{color:var(--bad)} .s-interrupted{color:var(--int)}
.spin{animation:spin 1.1s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px 0 6px;border-radius:11px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.running{background:var(--run-bg);color:var(--run)} .pill.suspended{background:var(--sus-bg);color:var(--sus)}
.pill.succeeded{background:var(--ok-bg);color:var(--ok)} .pill.failed{background:var(--bad-bg);color:var(--bad)} .pill.interrupted{background:var(--int-bg);color:var(--int)}

/* list */
.search{flex:1;display:flex;align-items:center;gap:6px;height:28px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:#fff;min-width:0}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,91,214,.15)}
.search input{border:0;outline:0;flex:1;min-width:0;font-size:12.5px;background:none}
.lmeta{flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 12px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line2)}
.row{display:grid;grid-template-columns:16px 1fr auto;gap:2px 9px;padding:9px 12px 9px 12px;border-bottom:1px solid var(--line2);cursor:pointer;position:relative;width:100%;text-align:left}
.row:hover{background:var(--hover)}
.row[aria-selected="true"]{background:var(--sel)}
.row[aria-selected="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--selbar)}
.zone-detail .row[aria-selected="true"]{background:#f1f1fb}
.zone-detail .row[aria-selected="true"]::before{background:#b9b9ec}
.row .si{margin-top:2px}
.row .l1{display:flex;gap:8px;align-items:baseline;min-width:0}
.row .wf{font-weight:500;white-space:nowrap}
.row .id{color:var(--muted)}
.row .key{color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .t{font-size:11.5px;color:var(--muted);white-space:nowrap}
.row .l2{grid-column:2 / 4;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .l2 b{font-weight:500;color:var(--text)}
.row .l2.bad{color:var(--bad)} .row .l2.sus b{color:var(--sus)}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty h3{margin:0 0 6px;font-size:14px;color:var(--text);font-weight:600}
.empty .btn{margin-top:12px}
.down-box{margin:24px 16px;padding:16px;border:1px solid #f3caca;background:var(--bad-bg);border-radius:8px;color:#7d2323}
.down-box h3{margin:0 0 6px;font-size:13.5px}
.down-box code{font-family:var(--mono);font-size:12px;display:block;margin:8px 0 12px;color:#9a2b2b}

/* detail */
#detail .scroll{padding:0 0 40px}
.dhead{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px 14px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.crumb button{color:var(--accent);font-weight:500}
.drow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.drow h1{font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em}
.copy{display:inline-flex;align-items:center;gap:5px;font:12px var(--mono);color:var(--muted);padding:2px 6px;border-radius:5px;border:1px solid transparent}
.copy:hover{border-color:var(--line);background:#fff;color:var(--text)}
.dhead .acts{margin-left:auto;display:flex;gap:6px}
.dsub{margin-top:6px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.dsub span b{font-weight:500;color:var(--text)}
.wrap{padding:16px 20px;max-width:880px}
.notice{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:8px;background:#eef0ff;border:1px solid #d8dbfb;color:#3a3aa8;font-size:12.5px;margin-bottom:12px}
.notice button{margin-left:auto;color:inherit;opacity:.7}
.now{border-radius:10px;border:1px solid var(--line);background:#fff;padding:14px 16px;border-left:4px solid var(--muted)}
.now.running{border-left-color:var(--run)} .now.suspended{border-left-color:var(--sus)} .now.failed{border-left-color:var(--bad)} .now.succeeded{border-left-color:var(--ok)} .now.interrupted{border-left-color:var(--int)}
.now .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.now .big{font-size:15px;font-weight:500;margin:4px 0 2px;letter-spacing:-.005em}
.now .big .mono{font-size:14px}
.now p{margin:6px 0 0;color:var(--muted)}
.now .clock{font:500 22px var(--mono);letter-spacing:-.02em;color:var(--sus);margin:6px 0 0}
.cause{margin:10px 0 0;padding:10px 12px;border-radius:7px;background:var(--bad-bg);color:#8a2525;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}
.cause.int{background:var(--int-bg);color:var(--text)}
pre.val{margin:0;padding:10px 12px;border-radius:7px;background:#f6f6f3;border:1px solid var(--line2);font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}
.h3{display:flex;align-items:center;gap:8px;margin:22px 0 8px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.h3 .faint{text-transform:none;letter-spacing:0;font-weight:400}
.journal{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.jitem{border-bottom:1px solid var(--line2)} .jitem:last-child{border-bottom:0}
.jrow{width:100%;display:grid;grid-template-columns:62px 18px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;text-align:left}
.jrow:hover{background:var(--hover)}
.jrow .ts{font:11.5px var(--mono);color:var(--faint)}
.jrow .nm{min-width:0;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.jrow .nm b{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.kind{font-size:10.5px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;height:18px;display:inline-flex;align-items:center;flex:none}
.att{font:500 11px var(--mono);border-radius:9px;padding:1px 7px;background:var(--int-bg);color:var(--muted);flex:none}
.att.bad{background:var(--bad-bg);color:var(--bad)} .att.run{background:var(--run-bg);color:var(--run)}
.jrow .r{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;gap:10px;align-items:center}
.jrow .chev{color:var(--faint);transition:transform .12s}
.jitem.open .chev{transform:rotate(90deg)}
.jrow .sub{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.jbody{padding:2px 12px 12px 102px;display:none}
.jitem.open .jbody{display:block}
.att-t{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px}
.att-t td{padding:5px 8px 5px 0;border-top:1px solid var(--line2);vertical-align:top}
.att-t td:first-child{white-space:nowrap;width:1%}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:12px;margin-bottom:8px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;word-break:break-word}
.link{color:var(--accent);font-weight:500}
.link:hover{text-decoration:underline}
details.pay{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:10px}
details.pay summary{cursor:pointer;padding:10px 14px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;list-style:none}
details.pay summary::before{content:"▸ ";}
details.pay[open] summary::before{content:"▾ ";}
details.pay pre{margin:0 14px 14px}
.dempty{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:40px}

/* slide-over */
.scrim{position:fixed;inset:0;background:rgba(20,20,18,.18);opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.slide{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.08);transform:translateX(102%);transition:transform .18s ease;z-index:21;display:flex;flex-direction:column}
.slide.on{transform:none}
.slide .phead{height:52px;padding:0 18px}
.slide .scroll{padding:16px 18px}
.sfoot{flex:none;border-top:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:10px}
.fld{margin-bottom:14px}
.fld label.l{display:flex;gap:6px;align-items:baseline;font-weight:500;font-size:12.5px;margin-bottom:5px}
.fld label.l .faint{font-weight:400;font-size:11.5px}
.fld input[type=text],.fld input[type=email],.fld input[type=date],.fld input[type=number],.fld select,.fld textarea,.raw{width:100%;height:32px;border:1px solid var(--line);border-radius:6px;padding:0 9px;background:#fff;outline:0}
.fld textarea,.raw{height:auto;min-height:72px;padding:7px 9px;resize:vertical}
.raw{font:12px/1.5 var(--mono);min-height:220px}
.fld input:focus,.fld select:focus,.fld textarea:focus,.raw:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,91,214,.15)}
.fld .h{font-size:11.5px;color:var(--faint);margin-top:4px}
.fld .err,.ferr{font-size:11.5px;color:var(--bad);margin-top:4px}
.fld.bad input,.fld.bad select{border-color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px;background:#f6f6f3;flex-wrap:wrap}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;padding:3px 11px;border-radius:5px;font-size:12.5px;cursor:pointer}
.seg input:checked+span{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1);font-weight:500}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border:1px solid var(--line);border-radius:12px;font:11.5px var(--mono);background:#fff}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer}
.wfdesc{font-size:12.5px;color:var(--muted);margin:2px 0 14px}
.wfmeta{font-size:11.5px;color:var(--faint);margin:-8px 0 16px}

dialog{border:1px solid var(--line);border-radius:12px;padding:0;width:min(440px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.18);color:var(--text)}
dialog::backdrop{background:rgba(20,20,18,.25)}
.dlg{padding:18px 20px}
.dlg h3{margin:0 0 6px;font-size:15px}
.dlg p{margin:0 0 10px;color:var(--muted)}
.dlg ol{margin:6px 0 12px;padding-left:20px}
.dlg li{margin:3px 0}
.dlg .f{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;background:#1c1c1a;color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;transition:all .18s;z-index:40;pointer-events:none;max-width:calc(100vw - 24px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad)}

@media (max-width:1200px){.panes{grid-template-columns:200px 340px minmax(0,1fr)}}
@media (max-width:900px){
  .panes{grid-template-columns:1fr}
  .pane{display:none;border-right:0}
  body[data-pane="nav"] #nav,body[data-pane="list"] #list,body[data-pane="detail"] #detail{display:flex}
  .back{display:inline-block}
  .hint,.srv .opt{display:none}
  .dhead{padding:10px 14px}
  .wrap{padding:14px}
  .jrow{grid-template-columns:18px minmax(0,1fr) auto}
  .jrow .ts{display:none}
  .jbody{padding-left:40px}
  .dhead .acts{margin-left:0;width:100%}
  .wfi .exe{display:inline-flex}
  .wfi .navi .n{visibility:hidden}
}
</style>
</head>
<body data-pane="list">
<header class="top">
  <div class="logo"><i></i>kymo</div>
  <div class="srv" id="srv"></div>
  <div class="sp"></div>
  <div class="hint"><span><kbd>j</kbd><kbd>k</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>/</kbd> search</span><span><kbd>r</kbd> resume</span><span><kbd>x</kbd> interrupt</span><span><kbd>e</kbd> execute</span></div>
  <button class="btn primary" data-act="execute">Execute…</button>
</header>
<main class="panes">
  <section class="pane" id="nav" aria-label="Views">
    <div class="phead"><h2>Views</h2></div>
    <div class="scroll" id="navBody"></div>
  </section>
  <section class="pane" id="list" aria-label="Executions">
    <div class="phead">
      <button class="back" data-act="to-nav">‹ Views</button>
      <label class="search"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--faint)"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><input id="q" placeholder="Search id, key, activity…" autocomplete="off" aria-label="Search executions"><kbd>/</kbd></label>
    </div>
    <div class="lmeta" id="lmeta"></div>
    <div class="scroll" id="rows" role="listbox" aria-label="Executions"></div>
  </section>
  <section class="pane" id="detail" aria-label="Execution detail" tabindex="-1">
    <div class="scroll" id="dBody"></div>
  </section>
</main>

<div class="scrim" id="scrim" data-act="close-exec"></div>
<aside class="slide" id="slide" aria-label="Execute workflow" aria-hidden="true">
  <div class="phead"><h2>Execute workflow</h2><div style="flex:1"></div><button class="btn" data-act="close-exec">Close <kbd>esc</kbd></button></div>
  <form class="scroll" id="xform" novalidate></form>
  <div class="sfoot">
    <label class="toggle"><input type="checkbox" id="discard"> discard <span class="faint">(fire &amp; forget, don't await result)</span></label>
    <div style="flex:1"></div>
    <button class="btn primary" id="xsubmit" form="xform" type="submit">Execute</button>
  </div>
</aside>

<dialog id="dlg"><form method="dialog" class="dlg" id="dlgBody"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script>
const K = window.KYMO, S = K.state;
const MODE = new URLSearchParams(location.search).get("state");
if (MODE === "down") S.server.status = "down";
if (MODE === "empty") S.executions.splice(0);
const T0 = Date.now(), N0 = Date.parse(K.NOW);
const now = () => N0 + (Date.now() - T0);
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const short = (id) => id.slice(0, 8);
const wfOf = (name) => S.workflows.find((w) => w.name === name);
const byId = (id) => S.executions.find((e) => e.id === id);

async function call(name, ...a) {
  if (S.server.status === "down") { await sleep(K.api.latency); throw { error: "server_unreachable", message: `connect ECONNREFUSED ${S.server.url}` }; }
  return K.api[name](...a);
}

/* ---------- formatting ---------- */
function dur(ms) {
  ms = Math.max(0, ms);
  if (ms < 1000) return Math.round(ms) + "ms";
  const s = ms / 1000;
  if (s < 60) return (s < 10 ? s.toFixed(1) : Math.round(s)) + "s";
  const m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (m < 60) return `${m}m ${Math.floor(s % 60)}s`;
  if (h < 24) return `${h}h ${m % 60}m`;
  return `${d}d ${h % 24}h`;
}
function ago(iso) {
  const ms = now() - Date.parse(iso);
  if (ms < 45000) return "just now";
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (m < 60) return m + "m ago"; if (h < 24) return h + "h ago"; return d + "d ago";
}
const pad = (n) => String(n).padStart(2, "0");
function clock(iso) { const d = new Date(iso); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`; }
function dateTime(iso) {
  const d = new Date(iso), today = new Date(N0).toISOString().slice(0, 10) === iso.slice(0, 10);
  return (today ? "today " : d.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" }) + " ") + clock(iso).slice(0, 5) + " UTC";
}
const json = (v) => esc(JSON.stringify(v, null, 2));
function causeLine(c) {
  if (!c) return "";
  if (c._tag === "Fail") return `Fail: ${c.error && c.error._tag ? c.error._tag : JSON.stringify(c.error)}`;
  if (c._tag === "Die") return `Die: ${c.defect.name}: ${c.defect.message}`;
  if (c._tag === "Interrupt") return `Interrupt (fiber ${c.fiberId})`;
  return c._tag;
}
function causeBlock(c) {
  if (!c) return "";
  if (c._tag === "Die") return `<div class="cause">Die  ${esc(c.defect.stack || c.defect.name + ": " + c.defect.message)}</div>`;
  if (c._tag === "Interrupt") return `<div class="cause int">Interrupt  fiber ${esc(c.fiberId)}</div>`;
  return `<div class="cause">Fail  ${json(c.error)}</div>`;
}
function exitBlock(x) {
  if (!x) return `<span class="faint">no exit yet</span>`;
  return x._tag === "Success" ? `<pre class="val">${json(x.value)}</pre>` : causeBlock(x.cause);
}

const ICON = {
  running: `<svg class="si s-running" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="5.5" opacity=".25"/><path class="spin" d="M8 2.5a5.5 5.5 0 0 1 5.5 5.5"/></svg>`,
  suspended: `<svg class="si s-suspended" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="currentColor" opacity=".16"/><rect x="5.6" y="5" width="1.7" height="6" rx=".6" fill="currentColor"/><rect x="8.7" y="5" width="1.7" height="6" rx=".6" fill="currentColor"/></svg>`,
  succeeded: `<svg class="si s-succeeded" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="currentColor"/><path d="M5.2 8.2 7.1 10l3.7-4" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  failed: `<svg class="si s-failed" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="currentColor"/><path d="M5.8 5.8l4.4 4.4M10.2 5.8l-4.4 4.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  interrupted: `<svg class="si s-interrupted" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 12 12 4" stroke="currentColor" stroke-width="1.6"/></svg>`,
};
const AICON = { success: ICON.succeeded, failure: ICON.failed, running: ICON.running, waiting: ICON.suspended, done: ICON.succeeded };
const pill = (s) => `<span class="pill ${s}">${ICON[s]}${s}</span>`;

/* ---------- domain helpers ---------- */
const runningAct = (e) => e.activities.find((a) => a.status === "running");
const openWait = (e) => e.waits.find((w) => w.status === "waiting");
const lastFailure = (e) => [...e.activities].reverse().find((a) => a.status === "failure");
const attemptsOf = (e, name) => e.activities.filter((a) => a.name === name).length;
const resultCause = (e) => e.result && (e.result.cause || (e.result.exit && e.result.exit.cause));
const pendingComps = (e) => e.compensations.filter((c) => c.registered && !c.ran).slice().reverse();

function summary(e) { // returns [html, cls]
  if (e.status === "running") {
    const a = runningAct(e);
    if (a) return [`<b>${esc(a.name)}</b> attempt ${a.attempt} running · ${dur(now() - Date.parse(a.startedAt))}`, ""];
    const c = e.childCalls.find((c) => { const ch = byId(c.execution); return ch && ["running", "suspended"].includes(ch.status); });
    if (c) return [`awaiting child <b>${esc(c.name)}</b> · ${byId(c.execution).status}`, ""];
    return ["running · replaying journal", ""];
  }
  if (e.status === "suspended") {
    const w = openWait(e);
    if (e.suspendedReason === "deferred" && w) return [`waiting <b>${esc(w.name)}</b> · ${dur(now() - Date.parse(w.since))}`, "sus"];
    if (e.suspendedReason === "clock" && w) return [`sleeping <b>${esc(w.name)}</b> · wakes in ${dur(Date.parse(w.wakeAt) - now())}`, "sus"];
    if (e.suspendedReason === "failure") { const f = lastFailure(e); return [`SuspendOnFailure · <b>${esc(causeLine(resultCause(e)))}</b>${f ? ` at ${esc(f.name)} ×${attemptsOf(e, f.name)}` : ""}`, "bad"]; }
    return [`suspended (${esc(e.suspendedReason || "child")})`, "sus"];
  }
  if (e.status === "failed") return [esc(causeLine(resultCause(e))), "bad"];
  if (e.status === "interrupted") { const n = e.compensations.filter((c) => c.ran).length; return [`interrupted${n ? ` · ${n} compensation${n > 1 ? "s" : ""} ran` : ""}`, ""]; }
  return [`succeeded in ${dur(Date.parse(e.endedAt) - Date.parse(e.startedAt))}`, ""];
}

/* ---------- views ---------- */
const SMART = [
  { key: "deferred", label: "Suspended on deferred", test: (e) => e.status === "suspended" && e.suspendedReason === "deferred", tone: "warm" },
  { key: "failure", label: "Suspended on failure", test: (e) => e.status === "suspended" && e.suspendedReason === "failure", tone: "hot" },
  { key: "failed", label: "Failed", test: (e) => e.status === "failed", tone: "hot" },
  { key: "running", label: "Running", test: (e) => e.status === "running" },
  { key: "clock", label: "Sleeping (clock)", test: (e) => e.status === "suspended" && e.suspendedReason === "clock" },
];
function viewTest(v) {
  if (v === "all") return () => true;
  if (v.startsWith("wf:")) return (e) => e.workflow === v.slice(3);
  const s = SMART.find((x) => x.key === v); return s ? s.test : () => true;
}
function viewLabel(v) {
  if (v === "all") return "All executions";
  if (v.startsWith("wf:")) return v.slice(3);
  return (SMART.find((x) => x.key === v) || {}).label || v;
}

/* ---------- state ---------- */

function visible() {

    .some((s) => s && String(s).toLowerCase().includes(q)))

      ? `<div class="empty"><h3>No executions match</h3>${ui.q ? `Nothing in “${esc(viewLabel(ui.view))}” matches “${esc(ui.q)}”.` : `Nothing in “${esc(viewLabel(ui.view))}” right now.`}<br><button class="btn" data-act="clear">Clear filters</button></div>`

function nowBlock(e) {
  const since = (iso) => `<span class="tick" data-since="${iso}">${dur(now() - Date.parse(iso))}</span>`;
  if (e.status === "running") {
    const a = runningAct(e);
    if (a) {
      const prev = e.activities.filter((x) => x.name === a.name && x.status === "failure");
      return `<div class="now running"><div class="k">Now · running</div><div class="big">Activity <b>${esc(a.name)}</b> is running — attempt ${a.attempt}</div><p>Started ${clock(a.startedAt)} UTC, ${since(a.startedAt)} ago.${prev.length ? ` Previous attempt${prev.length > 1 ? "s" : ""} failed:` : ""}</p>${prev.length ? causeBlock(prev[prev.length - 1].exit.cause) : ""}</div>`;
    }
    const c = e.childCalls.find((c) => { const ch = byId(c.execution); return ch && ["running", "suspended"].includes(ch.status); });
    if (c) { const ch = byId(c.execution); return `<div class="now running"><div class="k">Now · running</div><div class="big">Waiting for child workflow <b>${esc(c.name)}</b></div><p>Child <button class="link mono" data-act="goto" data-id="${ch.id}">${ch.workflow} ${short(ch.id)}</button> is ${ch.status}: ${summary(ch)[0]}</p></div>`; }
    return `<div class="now running"><div class="k">Now · running</div><div class="big">Running — replaying the journal</div><p>Completed activities return their recorded exits; execution continues from the first step without a journal entry.</p></div>`;
  }
  if (e.status === "suspended") {
    const w = openWait(e);
    if (e.suspendedReason === "deferred" && w) return `<div class="now suspended"><div class="k">Now · suspended on DurableDeferred</div><div class="big">Waiting for <b class="mono">${esc(w.name)}</b> for ${since(w.since)}</div><p>Since ${dateTime(w.since)}. Completes when your app resolves the deferred${w.schema ? ` with <span class="mono">${esc(w.schema)}</span>` : ""}. Resume replays the journal and continues if it has been completed.</p></div>`;
    if (e.suspendedReason === "clock" && w) return `<div class="now suspended"><div class="k">Now · sleeping on DurableClock</div><div class="big"><b class="mono">${esc(w.name)}</b> wakes ${dateTime(w.wakeAt)}</div><div class="clock tick" data-until="${w.wakeAt}">${dur(Date.parse(w.wakeAt) - now())}</div><p>Sleeping since ${dateTime(w.since)}. The engine resumes it automatically at wake time.</p></div>`;
    if (e.suspendedReason === "failure") {
      const f = lastFailure(e);
      return `<div class="now failed"><div class="k">Now · suspended on failure (SuspendOnFailure)</div><div class="big">${f ? `<b>${esc(f.name)}</b> failed ${attemptsOf(e, f.name)} times — workflow suspended instead of failing` : "Suspended after a failure"}</div><p>Fix the underlying problem, then Resume to retry from the failed step. Interrupt to give up and run compensations.</p>${causeBlock(resultCause(e))}</div>`;
    }
    return `<div class="now suspended"><div class="k">Now · suspended</div><div class="big">Suspended (${esc(e.suspendedReason)})</div></div>`;
  }
  if (e.status === "failed") return `<div class="now failed"><div class="k">Failed · ${dateTime(e.endedAt)}</div><div class="big">${esc(causeLine(resultCause(e)))}</div>${causeBlock(resultCause(e))}</div>`;
  if (e.status === "interrupted") {
    const ran = e.compensations.filter((c) => c.ran);
    return `<div class="now interrupted"><div class="k">Interrupted · ${dateTime(e.endedAt)}</div><div class="big">Interrupted${ran.length ? `; compensation${ran.length > 1 ? "s" : ""} ran: ${ran.map((c) => `<b>${esc(c.name)}</b>`).join(", ")}` : "; no compensations were registered"}</div>${e.interruptedBy ? `<p class="mono">${esc(e.interruptedBy)}</p>` : ""}</div>`;
  }
  return `<div class="now succeeded"><div class="k">Succeeded · ${dateTime(e.endedAt)} · took ${dur(Date.parse(e.endedAt) - Date.parse(e.startedAt))}</div><div style="margin-top:8px"><pre class="val">${json(e.result && e.result.exit && e.result.exit.value)}</pre></div></div>`;
}

function journal(e) {
  const items = [];
  let g = null;
  for (const a of e.activities) {
    if (g && g.name === a.name) g.attempts.push(a);
    else { g = { kind: "activity", name: a.name, attempts: [a], t: a.startedAt }; items.push(g); }
  }
  for (const w of e.waits) items.push({ kind: "wait", w, name: w.name, t: w.since });
  for (const c of e.childCalls) items.push({ kind: "child", c, name: c.name, t: c.startedAt });
  for (const c of e.compensations) {
    const act = [...e.activities].reverse().find((a) => a.name === c.activity && a.endedAt);
    items.push({ kind: "comp", c, name: c.name, t: c.ran && c.at ? c.at : act ? new Date(Date.parse(act.endedAt) + 1).toISOString() : e.startedAt });
  }
  items.sort((a, b) => Date.parse(a.t) - Date.parse(b.t));
  if (e.result && e.result._tag === "Complete") items.push({ kind: "result", name: "Result", t: e.endedAt });
  return items;
}
function jrow(e, it, i) {
  const key = e.id + ":" + it.kind + ":" + it.name + ":" + i, open = ui.open.has(key);
  let icon, kind, label = `<b>${esc(it.name)}</b>`, right = "", body = "";
  if (it.kind === "activity") {
    const last = it.attempts[it.attempts.length - 1], n = it.attempts.length;
    icon = AICON[last.status]; kind = "Activity";
    if (n > 1 || last.attempt > 1) label += `<span class="att ${last.status === "failure" ? "bad" : last.status === "running" ? "run" : ""}">${n} attempts</span>`;
    if (last.status === "failure" && last.exit) label += `<span class="sub">${esc(causeLine(last.exit.cause))}</span>`;
    const end = last.endedAt ? Date.parse(last.endedAt) : now();
    right = last.status === "running" ? `<span class="tick" data-since="${last.startedAt}">${dur(now() - Date.parse(last.startedAt))}</span>` : dur(end - Date.parse(it.attempts[0].startedAt));
    body = n > 1 ? `<table class="att-t">${it.attempts.map((a) => `<tr><td>${AICON[a.status]}</td><td class="mono">#${a.attempt}</td><td class="mono faint">${clock(a.startedAt)}</td><td class="mono">${a.endedAt ? dur(Date.parse(a.endedAt) - Date.parse(a.startedAt)) : "running"}</td><td style="width:100%">${a.exit ? exitBlock(a.exit) : `<span class="faint">in progress</span>`}</td></tr>`).join("")}</table>`
      : `<dl class="kv"><dt>Started</dt><dd class="mono">${clock(last.startedAt)}</dd><dt>Ended</dt><dd class="mono">${last.endedAt ? clock(last.endedAt) : "—"}</dd></dl>${exitBlock(last.exit)}`;
  } else if (it.kind === "wait") {
    const w = it.w; icon = AICON[w.status]; kind = w.kind === "deferred" ? "DurableDeferred" : "DurableClock";
    right = w.status === "waiting" ? (w.kind === "clock" ? `wakes in <span class="tick" data-until="${w.wakeAt}">${dur(Date.parse(w.wakeAt) - now())}</span>` : `waiting <span class="tick" data-since="${w.since}">${dur(now() - Date.parse(w.since))}</span>`)
      : w.doneAt ? dur(Date.parse(w.doneAt) - Date.parse(w.since)) : w.wakeAt ? dur(Date.parse(w.wakeAt) - Date.parse(w.since)) : "done";
    body = `<dl class="kv"><dt>Since</dt><dd>${dateTime(w.since)}</dd>${w.wakeAt ? `<dt>Wake at</dt><dd>${dateTime(w.wakeAt)}</dd>` : ""}${w.doneAt ? `<dt>Completed</dt><dd>${dateTime(w.doneAt)}</dd>` : ""}${w.schema ? `<dt>Schema</dt><dd class="mono">${esc(w.schema)}</dd>` : ""}<dt>Status</dt><dd>${esc(w.status)}</dd></dl>${w.exit ? exitBlock(w.exit) : ""}`;
  } else if (it.kind === "child") {
    const ch = byId(it.c.execution); icon = ch ? ICON[ch.status] : ICON.running; kind = "Child workflow";
    label += ch ? `<span class="link mono" role="link" data-act="goto" data-id="${ch.id}">${esc(ch.workflow)} ${short(ch.id)} →</span>` : "";
    right = ch ? ch.status : "";
    body = ch ? `<dl class="kv"><dt>Execution</dt><dd><button class="link mono" data-act="goto" data-id="${ch.id}">${ch.id}</button></dd><dt>Status</dt><dd>${pill(ch.status)}</dd><dt>Now</dt><dd>${summary(ch)[0]}</dd></dl>` : `<span class="faint">child not found</span>`;
  } else if (it.kind === "comp") {
    const c = it.c; icon = c.ran ? ICON.succeeded : `<svg class="si" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--faint)"><circle cx="8" cy="8" r="5.5" stroke-dasharray="2 2"/></svg>`; kind = "Compensation";
    label += `<span class="sub">${c.ran ? "ran" : "registered"} for ${esc(c.activity)}</span>`;
    right = c.ran ? "ran" : "on interrupt";
    body = `<dl class="kv"><dt>Undoes</dt><dd>${esc(c.activity)}</dd><dt>Status</dt><dd>${c.ran ? `ran ${c.at ? dateTime(c.at) : ""}` : "registered — runs only if the execution is interrupted"}</dd></dl>${c.exit ? exitBlock(c.exit) : ""}`;
  } else {
    const x = e.result.exit; icon = x._tag === "Success" ? ICON.succeeded : ICON[e.status] || ICON.failed; kind = "Exit";
    label = `<b>${x._tag === "Success" ? "Success" : esc(causeLine(x.cause))}</b>`;
    right = dur(Date.parse(e.endedAt) - Date.parse(e.startedAt));
    body = exitBlock(x);
  }
  return `<div class="jitem${open ? " open" : ""}"><button class="jrow" data-act="toggle" data-key="${esc(key)}" data-ji="${i}" aria-expanded="${open}"><span class="ts">${clock(it.t)}</span>${icon}<span class="nm"><span class="kind">${kind}</span>${label}</span><span class="r">${right}<svg class="chev" width="10" height="10" viewBox="0 0 10 10"><path d="M3 2l4 3-4 3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></span></button><div class="jbody">${body}</div></div>`;
}

function renderDetail() {
  const d = $("#dBody"), e = ui.sel && byId(ui.sel);

  d.innerHTML = `<div class="dhead">
    <button class="back" data-act="to-list">‹ Executions</button>
    ${parent ? `<div class="crumb">↑ child of <button data-act="goto" data-id="${parent.id}">${esc(parent.workflow)} <span class="mono">${short(parent.id)}</span></button>${ICON[parent.status]}<span>${parent.status}</span></div>` : ""}
    <div class="drow"><h1>${esc(e.workflow)}</h1><button class="copy" data-act="copy" data-id="${e.id}" title="Copy execution id">${e.id}<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg></button>${pill(e.status)}
      <div class="acts"><button class="btn" data-act="resume" ${canResume ? "" : "disabled"} title="${canResume ? "Resume (r)" : "Only suspended executions can be resumed"}">${ui.busy === "resume" ? "Resuming…" : "Resume"} <kbd>r</kbd></button><button class="btn danger" data-act="interrupt" ${canInt ? "" : "disabled"} title="${canInt ? "Interrupt (x)" : "Already terminal"}">Interrupt <kbd>x</kbd></button></div></div>
    <div class="dsub"><span>key <b class="mono">${esc(e.idempotencyKey)}</b></span><span>started <b>${dateTime(e.startedAt)}</b></span><span>${e.endedAt ? `ended <b>${dateTime(e.endedAt)}</b>` : `elapsed <b class="tick" data-since="${e.startedAt}">${dur(now() - Date.parse(e.startedAt))}</b>`}</span>${e.children.length ? `<span>${e.children.length} child execution${e.children.length > 1 ? "s" : ""}</span>` : ""}</div>
  </div>
  <div class="wrap">
    ${ui.notice && ui.notice.id === e.id ? `<div class="notice">${ui.notice.dedup ? "↺" : "✓"} ${esc(ui.notice.text)}<button data-act="dismiss" aria-label="Dismiss">✕</button></div>` : ""}
    ${nowBlock(e)}
    <div class="h3">Journal <span class="faint">${items.length} entries · oldest first · <kbd>↵</kbd> expand</span></div>
    ${items.length ? `<div class="journal">${items.map((it, i) => jrow(e, it, i)).join("")}</div>` : `<div class="journal"><div class="empty" style="padding:18px">No journal entries yet.</div></div>`}
    <details class="pay"><summary>Payload</summary><pre class="val">${json(e.payload)}</pre></details>
  </div>`;
  if (ui.zone === "detail") focusJournal();
}
function focusJournal() {
  const rows = [...document.querySelectorAll("#dBody .jrow")];
  if (!rows.length) { $("#detail").focus(); return; }
  ui.jf = Math.max(0, Math.min(ui.jf, rows.length - 1));
  rows[ui.jf].focus({ preventScroll: false });
}
function render() { renderTop(); renderNav(); renderList(); renderDetail(); syncHash(); }

/* ---------- actions ---------- */
let toastT;
function toast(msg, bad) { const t = $("#toast"); t.textContent = msg; t.className = "toast on" + (bad ? " bad" : ""); clearTimeout(toastT); toastT = setTimeout(() => (t.className = "toast" + (bad ? " bad" : "")), 2600); }
function select(id, { scroll = true } = {}) {
  if (ui.sel !== id) { ui.jf = 0; if (ui.notice && ui.notice.id !== id) ui.notice = null; }
  ui.sel = id; renderList(); renderDetail(); syncHash();
  if (scroll) { const r = $(`#rows .row[data-id="${id}"]`); r && r.scrollIntoView({ block: "nearest" }); }
}
function move(d) {
  const list = visible(); if (!list.length) return;
  let i = list.findIndex((e) => e.id === ui.sel);
  i = i < 0 ? 0 : Math.max(0, Math.min(list.length - 1, i + d));
  select(list[i].id);
}
function setPane(p) { document.body.dataset.pane = p; }
function focusDetail() { if (!ui.sel) return; ui.zone = "detail"; setPane("detail"); renderList(); renderDetail(); }
function focusList() { ui.zone = "list"; setPane("list"); renderList(); renderDetail(); const r = $(`#rows .row[aria-selected="true"]`); r && r.scrollIntoView({ block: "nearest" }); document.activeElement && document.activeElement.blur(); }
async function load() {
  ui.busy = true; renderList();
  try { await call("listExecutions", {}); ui.boot = "ok"; ui.err = null; }
  catch (err) { ui.boot = "down"; ui.err = err; }
  ui.busy = false;
  if (ui.boot === "ok" && !ui.sel) { const v = visible(); if (v[0] && matchMedia("(min-width:901px)").matches) ui.sel = v[0].id; }
  render();
}
async function doResume() {
  const e = byId(ui.sel); if (!e || e.status !== "suspended" || ui.busy) return;
  ui.busy = "resume"; renderDetail();
  try { await call("resume", e.id); toast(`Resumed ${short(e.id)} · now running`); }
  catch (err) { toast(err.message || String(err), true); }
  ui.busy = false; render();
}
function askInterrupt() {
  const e = byId(ui.sel); if (!e || !["running", "suspended"].includes(e.status)) return;
  const comps = pendingComps(e), kids = e.children.map(byId).filter((c) => c && ["running", "suspended"].includes(c.status));
  $("#dlgBody").innerHTML = `<h3>Interrupt ${esc(e.workflow)} <span class="mono muted">${short(e.id)}</span>?</h3>
    <p>Interrupt is terminal — the execution cannot be resumed afterwards.</p>
    ${comps.length ? `<p style="margin-bottom:0;color:var(--text)">These compensations will run, in this order:</p><ol>${comps.map((c) => `<li><b>${esc(c.name)}</b> <span class="muted">undoes ${esc(c.activity)}</span></li>`).join("")}</ol>` : `<p>No compensations are registered — nothing will be undone.</p>`}
    ${kids.length ? `<p>Child execution${kids.length > 1 ? "s" : ""} will also be interrupted: ${kids.map((c) => `<span class="mono">${esc(c.workflow)} ${short(c.id)}</span>`).join(", ")}</p>` : ""}
    <div class="f"><button class="btn" value="cancel" autofocus>Cancel</button><button class="btn danger solid" value="ok">Interrupt</button></div>`;
  const dlg = $("#dlg");
  dlg.returnValue = ""; dlg.showModal();
  dlg.onclose = async () => {
    if (dlg.returnValue !== "ok") return;
    try {
      await call("interrupt", e.id);
      e.endedAt = new Date(now()).toISOString();
      comps.forEach((c) => (c.at = e.endedAt));
      kids.forEach((c) => (c.endedAt = e.endedAt));
      toast(`Interrupted ${short(e.id)}${comps.length ? ` · ran ${comps.map((c) => c.name).join(", ")}` : ""}`);
    } catch (err) { toast(err.message || String(err), true); }
    render();
  };
}
function copyId(id) { (navigator.clipboard ? navigator.clipboard.writeText(id) : Promise.reject()).then(() => toast("Copied " + id), () => toast(id)); }

/* ---------- execute slide-over ---------- */
const X = { wf: null, raw: false, err: null, result: null, busy: false };
function recentPayloads(wf) {
  const seen = new Set(), out = [];
  for (const e of [...S.executions].filter((e) => e.workflow === wf).sort((a, b) => Date.parse(b.startedAt) - Date.parse(a.startedAt))) {
    const k = JSON.stringify(e.payload); if (seen.has(k)) continue; seen.add(k); out.push(e); if (out.length >= 5) break;
  }
  return out;
}
function fieldHtml(name, s, req) {
  const id = "f_" + name, hint = [];
  if (s.pattern) hint.push(`matches <span class="mono">${esc(s.pattern)}</span>`);
  if (s.minimum != null) hint.push(`≥ ${s.minimum}`);
  if (s.maxLength) hint.push(`max ${s.maxLength} chars`);
  let input;
  if (s.enum) input = s.enum.length <= 4
    ? `<div class="seg" role="radiogroup">${s.enum.map((v) => `<label><input type="radio" name="${name}" value="${esc(v)}"><span>${esc(v)}</span></label>`).join("")}</div>`
    : `<select id="${id}" name="${name}"><option value="">—</option>${s.enum.map((v) => `<option>${esc(v)}</option>`).join("")}</select>`;
  else if (s.type === "integer" || s.type === "number") input = `<input type="number" id="${id}" name="${name}" ${s.type === "integer" ? 'step="1"' : ""} ${s.minimum != null ? `min="${s.minimum}"` : ""}>`;
  else if (s.maxLength > 100) input = `<textarea id="${id}" name="${name}" maxlength="${s.maxLength}"></textarea>`;
  else input = `<input type="${s.format === "email" ? "email" : s.format === "date" ? "date" : "text"}" id="${id}" name="${name}" placeholder="${esc((s.examples && s.examples[0]) || "")}" spellcheck="false" ${s.format ? "" : 'class="mono"'}>`;
  return `<div class="fld" data-f="${name}"><label class="l" for="${id}">${esc(name)} ${req ? "" : `<span class="faint">optional</span>`}<span class="faint">${esc(s.format || s.type)}</span></label>${input}${hint.length ? `<div class="h">${hint.join(" · ")}</div>` : ""}<div class="err"></div></div>`;
}
function renderExec() {
  const w = wfOf(X.wf), sch = w.payload, recent = recentPayloads(w.name);
  $("#xform").innerHTML = `
    <div class="fld"><label class="l" for="xwf">Workflow</label><select id="xwf">${S.workflows.map((x) => `<option ${x.name === w.name ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></div>
    <div class="wfdesc">${esc(w.description)}</div>
    <div class="wfmeta mono">idempotencyKey = ${esc(w.idempotencyKey)}${w.annotations.length ? " · " + w.annotations.map(esc).join(", ") : ""}</div>
    ${recent.length ? `<div class="sect" style="padding:0 0 2px">Prefill from recent</div><div class="chips">${recent.map((e) => `<button type="button" class="chip" data-act="prefill" data-id="${e.id}" title="${esc(JSON.stringify(e.payload))}">${ICON[e.status]}${esc(e.idempotencyKey)}</button>`).join("")}</div>` : ""}
    <div style="display:flex;align-items:center;margin-bottom:10px"><div class="sect" style="padding:0">Payload</div><div style="flex:1"></div><label class="toggle"><input type="checkbox" id="xraw" ${X.raw ? "checked" : ""}> raw JSON</label></div>
    <div id="xfields" ${X.raw ? "hidden" : ""}>${Object.entries(sch.properties).map(([k, s]) => fieldHtml(k, s, sch.required.includes(k))).join("")}</div>
    <textarea class="raw" id="xjson" spellcheck="false" ${X.raw ? "" : "hidden"}></textarea>
    <div class="ferr" id="xerr"></div>`;
}
function readForm() {
  const sch = wfOf(X.wf).payload, out = {};
  for (const [k, s] of Object.entries(sch.properties)) {
    let v;
    if (s.enum && s.enum.length <= 4) { const r = $(`#xform input[name="${k}"]:checked`); v = r ? r.value : ""; }
    else v = $(`#xform [name="${k}"]`).value.trim();
    if (v === "") continue;
    out[k] = (s.type === "integer" || s.type === "number") && !isNaN(Number(v)) ? Number(v) : v;
  }
  return out;
}
function fillForm(p) {
  const sch = wfOf(X.wf).payload;
  for (const [k, s] of Object.entries(sch.properties)) {
    const v = p[k] ?? "";
    if (s.enum && s.enum.length <= 4) document.querySelectorAll(`#xform input[name="${k}"]`).forEach((r) => (r.checked = r.value === String(v)));
    else $(`#xform [name="${k}"]`).value = v;
  }
  $("#xjson").value = JSON.stringify(p, null, 2);
}
function validate(p) {
  const sch = wfOf(X.wf).payload, errs = {};
  for (const k of sch.required) if (p[k] === undefined || p[k] === "") errs[k] = "required";
  for (const [k, v] of Object.entries(p)) {
    const s = sch.properties[k]; if (!s) { errs[k] = "unknown field"; continue; }
    if (s.enum && !s.enum.includes(v)) errs[k] = `one of ${s.enum.join(", ")}`;
    else if (s.type === "integer" && !Number.isInteger(v)) errs[k] = "must be an integer";
    else if (s.minimum != null && v < s.minimum) errs[k] = `must be ≥ ${s.minimum}`;
    else if (s.pattern && !new RegExp(s.pattern).test(v)) errs[k] = `must match ${s.pattern}`;
    else if (s.format === "email" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) errs[k] = "not an email";
    else if (s.maxLength && String(v).length > s.maxLength) errs[k] = `max ${s.maxLength} chars`;
  }
  return errs;
}
function openExec(wf) {
  X.wf = wf || (ui.view.startsWith("wf:") ? ui.view.slice(3) : (byId(ui.sel) || {}).workflow) || S.workflows[0].name;
  X.raw = false; renderExec();
  $("#slide").classList.add("on"); $("#slide").setAttribute("aria-hidden", "false"); $("#scrim").classList.add("on");
  setTimeout(() => { const f = $("#xfields input:not([type=radio]), #xfields select, #xfields textarea"); (f || $("#xwf")).focus(); }, 60);
}
function closeExec() { $("#slide").classList.remove("on"); $("#slide").setAttribute("aria-hidden", "true"); $("#scrim").classList.remove("on"); }
const execOpen = () => $("#slide").classList.contains("on");

$("#xform").addEventListener("change", (ev) => {
  if (ev.target.id === "xwf") { X.wf = ev.target.value; renderExec(); }
  else if (ev.target.id === "xraw") {
    const err = $("#xerr");
    if (ev.target.checked) { $("#xjson").value = JSON.stringify(readForm(), null, 2); X.raw = true; }
    else { try { const p = JSON.parse($("#xjson").value || "{}"); X.raw = false; fillForm(p); err.textContent = ""; } catch (e) { ev.target.checked = true; err.textContent = "Invalid JSON: " + e.message; return; } }
    $("#xfields").hidden = X.raw; $("#xjson").hidden = !X.raw;
  }
});
$("#xform").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if (X.busy) return;
  const err = $("#xerr"); err.textContent = "";
  document.querySelectorAll("#xform .fld").forEach((f) => { f.classList.remove("bad"); const e = f.querySelector(".err"); e && (e.textContent = ""); });
  let p;
  if (X.raw) { try { p = JSON.parse($("#xjson").value); } catch (e) { err.textContent = "Invalid JSON: " + e.message; return; } }
  else p = readForm();
  const errs = validate(p);
  if (Object.keys(errs).length) {
    if (X.raw) err.textContent = Object.entries(errs).map(([k, v]) => `${k}: ${v}`).join(" · ");
    else for (const [k, v] of Object.entries(errs)) { const f = $(`#xform .fld[data-f="${k}"]`); if (f) { f.classList.add("bad"); f.querySelector(".err").textContent = v; } }
    return;
  }
  X.busy = true; $("#xsubmit").disabled = true; $("#xsubmit").textContent = "Executing…";
  try {
    const r = await call("execute", X.wf, p, { discard: $("#discard").checked });
    const e = byId(r.executionId);
    if (!r.deduplicated && e) e.startedAt = new Date(now()).toISOString();
    ui.notice = { id: r.executionId, dedup: r.deduplicated, text: r.deduplicated
      ? `Existing execution returned (same idempotencyKey ${e ? e.idempotencyKey : ""}) — nothing was re-run.`
      : `Started ${X.wf} ${short(r.executionId)}${r.discard ? " (discard: result not awaited)" : ""}.` };
    closeExec();
    ui.view = "wf:" + X.wf; ui.q = ""; $("#q").value = "";
    ui.sel = r.executionId; ui.jf = 0; ui.zone = "list"; setPane("detail");
    render(); select(r.executionId);
    toast(r.deduplicated ? "Deduplicated — existing execution selected" : "Execution started");
  } catch (e) { err.textContent = `${e.error || "error"}: ${e.message || e}`; }
  X.busy = false; $("#xsubmit").disabled = false; $("#xsubmit").textContent = "Execute";
});

/* ---------- events ---------- */
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act;
  if (a === "view") { ui.view = t.dataset.v; ui.zone = "list"; setPane("list"); const v = visible(); if (v.length && !v.some((e) => e.id === ui.sel) && matchMedia("(min-width:901px)").matches) ui.sel = v[0].id; render(); }
  else if (a === "select") { ui.zone = "list"; select(t.dataset.id, { scroll: false }); if (matchMedia("(max-width:900px)").matches) focusDetail(); }
  else if (a === "goto") { ev.stopPropagation(); ui.jf = 0; select(t.dataset.id); }
  else if (a === "toggle") { const k = t.dataset.key; ui.open.has(k) ? ui.open.delete(k) : ui.open.add(k); ui.jf = +t.dataset.ji; ui.zone = "detail"; renderList(); renderDetail(); }
  else if (a === "copy") copyId(t.dataset.id);
  else if (a === "resume") doResume();
  else if (a === "interrupt") askInterrupt();
  else if (a === "execute") { ev.stopPropagation(); openExec(t.dataset.wf); }
  else if (a === "close-exec") closeExec();
  else if (a === "prefill") { const e = byId(t.dataset.id); fillForm(e.payload); }
  else if (a === "retry") load();
  else if (a === "clear") { ui.view = "all"; ui.q = ""; $("#q").value = ""; render(); }
  else if (a === "dismiss") { ui.notice = null; renderDetail(); }
  else if (a === "to-nav") setPane("nav");
  else if (a === "to-list") focusList();
});
$("#q").value = ui.q;
$("#q").addEventListener("input", (ev) => { ui.q = ev.target.value; renderList(); syncHash(); });
$("#q").addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" || ev.key === "ArrowDown" || ev.key === "Enter") { ev.preventDefault(); ev.target.blur(); ui.zone = "list"; const v = visible(); if (v.length && !v.some((e) => e.id === ui.sel)) select(v[0].id); else renderList(); }
});
document.addEventListener("keydown", (ev) => {
  if ($("#dlg").open) return;
  if (execOpen()) { if (ev.key === "Escape") { ev.preventDefault(); closeExec(); } return; }
  if (ev.target.matches("input,textarea,select") || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key;
  if (k === "/") { ev.preventDefault(); $("#q").focus(); $("#q").select(); return; }
  if (ui.boot !== "ok") return;
  if (k === "e") { ev.preventDefault(); openExec(); return; }
  if (k === "r") { doResume(); return; }
  if (k === "x") { askInterrupt(); return; }
  if (k === "c" && ui.sel) { copyId(ui.sel); return; }
  if (ui.zone === "detail") {
    const rows = document.querySelectorAll("#dBody .jrow");
    if (k === "j" || k === "ArrowDown") { ev.preventDefault(); ui.jf = Math.min(rows.length - 1, ui.jf + 1); focusJournal(); }
    else if (k === "k" || k === "ArrowUp") { ev.preventDefault(); ui.jf = Math.max(0, ui.jf - 1); focusJournal(); }
    else if ((k === "Enter" || k === " ") && document.activeElement.matches(".jrow")) { ev.preventDefault(); document.activeElement.click(); }
    else if (k === "Escape" || k === "ArrowLeft" || k === "h") { ev.preventDefault(); focusList(); }
    else if (k === "p") { const e = byId(ui.sel); if (e && e.parent) select(e.parent); }
    return;
  }
  if (k === "j" || k === "ArrowDown") { ev.preventDefault(); move(1); }
  else if (k === "k" || k === "ArrowUp") { ev.preventDefault(); move(-1); }
  else if (k === "Enter" || k === "ArrowRight" || k === "l") { ev.preventDefault(); focusDetail(); }
});
$("#detail").addEventListener("focusin", (ev) => { const r = ev.target.closest(".jrow"); if (r) { ui.jf = +r.dataset.ji; if (ui.zone !== "detail") { ui.zone = "detail"; document.body.classList.add("zone-detail"); } } });
$("#rows").addEventListener("mousedown", () => { if (ui.zone !== "list") { ui.zone = "list"; document.body.classList.remove("zone-detail"); } });
setInterval(() => {
  document.querySelectorAll(".tick").forEach((el) => {
    el.textContent = el.dataset.until ? dur(Date.parse(el.dataset.until) - now()) : dur(now() - Date.parse(el.dataset.since));
  });
}, 1000);

if (ui.sel) setPane("detail");
render();
load();
</script>
</body>
</html>
