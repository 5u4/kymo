<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>kymo · trace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0d10; --side:#0f1013; --panel:#121317; --raise:#17181d; --hover:#1b1d22; --sel:#1f2130;
  --line:#1f2127; --line2:#2b2e36;
  --fg:#e3e4e8; --fg2:#a4a8b1; --mute:#6c717c;
  --accent:#7d75ff; --accent2:#a29dff;
  --run:#4d8dff; --sus:#f2a93b; --ok:#34c27a; --fail:#f2554f; --int:#8a8f9a; --clock:#2fc6b4; --comp:#c77dff;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif; --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --treew:300px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:12px}
.mute{color:var(--mute)} .fg2{color:var(--fg2)}
svg{flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* shell */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;font-weight:600;letter-spacing:-.01em}
.logo{width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,var(--accent),#4d8dff);display:grid;place-items:center;font:600 11px var(--mono);color:#fff}
.envbox{margin:4px 10px 12px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.envbox .row1{display:flex;align-items:center;gap:7px;font-weight:500}
.envbox .row2{color:var(--mute);font:11px var(--mono);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px #34c27a22}
.dot.down{background:var(--fail);box-shadow:0 0 0 3px #f2554f22}
.navh{padding:10px 16px 4px;color:var(--mute);font-size:11px;font-weight:500}
.nav a{display:flex;align-items:center;gap:9px;margin:1px 8px;padding:6px 8px;border-radius:6px;color:var(--fg2)}
.nav a:hover{background:var(--hover);color:var(--fg)}
.nav a[aria-current=page]{background:var(--sel);color:var(--fg)}
.badge{margin-left:auto;min-width:18px;padding:0 5px;border-radius:9px;background:#f2a93b22;color:var(--sus);font:500 11px/18px var(--mono);text-align:center}
.sidefoot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--line);color:var(--mute);font:11px/1.6 var(--mono)}
main{min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 20px;border-bottom:1px solid var(--line);flex:none}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--fg2);min-width:0;white-space:nowrap;overflow:hidden}
.crumbs a:hover{color:var(--fg)} .crumbs .sep{color:var(--mute)} .crumbs b{font-weight:500;color:var(--fg);overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.page{padding:16px 20px 28px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:6px;border:1px solid var(--line2);background:var(--raise);cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover:not(:disabled){background:var(--hover);border-color:#3a3e48}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:#8d86ff}
.btn.danger{color:#ff8a85;border-color:#5a2a2a;background:#2a1517}
.btn.danger:hover:not(:disabled){background:#371a1c}
.btn.danger.solid{background:#c93f3a;border-color:#c93f3a;color:#fff}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg2)} .btn.ghost:hover{color:var(--fg)}
kbd{font:10px var(--mono);padding:1px 4px;border-radius:3px;border:1px solid #ffffff30;opacity:.8}
.input,select.input,textarea.input{height:28px;padding:0 9px;border-radius:6px;border:1px solid var(--line2);background:var(--panel);outline:none;min-width:0}
textarea.input{height:auto;padding:8px 9px;resize:vertical}
.input:focus{border-color:var(--accent)}
.input.bad{border-color:var(--fail)}

/* status */
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px 0 5px;border-radius:5px;font-size:12px;font-weight:500;white-space:nowrap;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c)}
.s-run{--c:var(--run)} .s-sus{--c:var(--sus)} .s-ok{--c:var(--ok)} .s-fail{--c:var(--fail)} .s-int{--c:var(--int)} .s-clock{--c:var(--clock)} .s-comp{--c:var(--comp)}
.ic{color:var(--c)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1.1s linear infinite}

/* filter bar + table */
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ph h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:6px;border:1px solid var(--line2);background:transparent;cursor:pointer;color:var(--fg2);font-size:12px}
.chip:hover{color:var(--fg);background:var(--hover)}
.chip[aria-pressed=true]{background:var(--sel);color:var(--fg);border-color:#3b3f68}
.chip .n{font:11px var(--mono);color:var(--mute)}
.search{position:relative;margin-left:auto}
.search svg{position:absolute;left:8px;top:7px;color:var(--mute)}
.search .input{padding-left:27px;width:260px}
.tw{border:1px solid var(--line);border-radius:8px;overflow-x:auto;background:var(--panel)}
table.t{width:100%;border-collapse:collapse;white-space:nowrap}
.t th{font-weight:500;color:var(--mute);text-align:left;font-size:12px;padding:0 12px;height:32px;border-bottom:1px solid var(--line);background:var(--side)}
.t td{padding:0 12px;height:38px;border-bottom:1px solid var(--line)}
.t tr:last-child td{border-bottom:0}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:var(--hover)}
.t td.r,.t th.r{text-align:right}
.idc{display:inline-flex;align-items:center;gap:6px}
.copy{opacity:0;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;border:0;background:transparent;color:var(--mute);cursor:pointer}
tr:hover .copy,.copy:focus-visible,.always .copy{opacity:1} .copy:hover{background:var(--line2);color:var(--fg)}
.kid{color:var(--mute);margin-right:2px;font-family:var(--mono)}
.step{display:inline-flex;align-items:center;gap:6px;color:var(--fg2);max-width:300px;overflow:hidden;text-overflow:ellipsis} .step .sub{color:var(--mute)}
.t td.dur{min-width:84px}
.empty{padding:48px 16px;text-align:center;color:var(--fg2)}
.empty h3{margin:0 0 4px;font-size:14px;color:var(--fg);font-weight:500}
.empty p{margin:0 0 14px}
.loading{padding:28px 16px;color:var(--mute);display:flex;align-items:center;gap:8px;justify-content:center}

/* detail */
.dh{padding:14px 20px 12px;border-bottom:1px solid var(--line);flex:none}
.dh1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dh1 h1{font-size:16px;font-weight:600;margin:0}
.dh1 .acts{margin-left:auto;display:flex;gap:8px}
.meta{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:9px;color:var(--fg2);font-size:12px}
.meta span b{color:var(--mute);font-weight:400;margin-right:6px}
.banner{display:flex;gap:9px;align-items:flex-start;margin-top:12px;padding:9px 11px;border-radius:7px;border:1px solid color-mix(in srgb,var(--c) 30%,transparent);background:color-mix(in srgb,var(--c) 8%,transparent);color:var(--fg)}
.banner svg{margin-top:1px;color:var(--c)}
.split{flex:1;min-height:0;display:grid;grid-template-columns:var(--left,58%) 5px minmax(300px,1fr)}
.pane{min-width:0;min-height:0;overflow:auto}
.gutter{cursor:col-resize;background:var(--line);position:relative}
.gutter:hover,.gutter.drag{background:var(--accent)}
.trace{position:relative;outline:none;min-width:520px}
.trh{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:var(--treew) 1fr;height:30px;background:var(--side);border-bottom:1px solid var(--line);font-size:11px;color:var(--mute)}
.trh>div:first-child{padding:0 12px;display:flex;align-items:center;gap:6px;border-right:1px solid var(--line)}
.ruler{position:relative;overflow:hidden}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2);padding:8px 0 0 4px;font:10px var(--mono);white-space:nowrap}
.tick.now{border-left:1px dashed var(--accent);color:var(--accent2)}
.tick.now.flip{transform:translateX(-100%);border-left:0;border-right:1px dashed var(--accent);padding:8px 4px 0 0}
.grid{position:absolute;top:30px;bottom:0;left:var(--treew);right:0;pointer-events:none}
.grid i{position:absolute;top:0;bottom:0;border-left:1px solid #ffffff08}
.grid i.now{border-left:1px dashed #7d75ff88}
.tr{display:grid;grid-template-columns:var(--treew) 1fr;height:30px;cursor:pointer;position:relative}
.tr:hover{background:#ffffff06}
.tr[aria-selected=true]{background:var(--sel)}
.tr[aria-selected=true]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.tl{display:flex;align-items:center;gap:6px;min-width:0;padding-right:10px;border-right:1px solid var(--line)}
.tl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto;min-width:24px}
.tl .ty{color:var(--mute);font-size:11px;white-space:nowrap;flex:0 100 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.brand .dot{display:none}
.tl .x{color:var(--mute);font:11px var(--mono);margin-left:auto;white-space:nowrap}
.tog{width:16px;height:16px;display:grid;place-items:center;border:0;background:none;color:var(--mute);cursor:pointer;padding:0;border-radius:3px;flex:none}
.tog:hover{background:var(--line2);color:var(--fg)}
.tog svg{transition:transform .12s} .tog[aria-expanded=true] svg{transform:rotate(90deg)}
.tog.nokids{visibility:hidden}
.guide{width:14px;align-self:stretch;flex:none;border-left:1px solid var(--line2);margin-left:7px}
.wf{position:relative;overflow:hidden}
.bar{position:absolute;top:10px;height:10px;min-width:2px;border-radius:2px;background:var(--c)}
.bar.thin{top:13px;height:4px;opacity:.75}
.bar.wait{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,transparent) 0 4px,color-mix(in srgb,var(--c) 30%,transparent) 4px 8px)}
.bar.future{background:transparent;border:1px dashed var(--c);opacity:.7}
.bar.pt{width:9px;height:9px;min-width:0;border-radius:1px;transform:translateX(-4px) rotate(45deg);top:10px}
.blab{position:absolute;top:8px;font:10px/14px var(--mono);color:var(--fg2);white-space:nowrap}
.insp{border-left:0;background:var(--panel);display:flex;flex-direction:column}
.ih{padding:12px 16px 0;border-bottom:1px solid var(--line);flex:none;position:sticky;top:0;background:var(--panel);z-index:2}
.ih .t1{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-width:0}
.ih .t1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ih .t2{color:var(--mute);font-size:12px;margin:2px 0 10px}
.tabs{display:flex;gap:16px}
.tabs button{border:0;background:none;padding:0 0 8px;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
.tabs button:hover{color:var(--fg2)}
.tabs button[aria-selected=true]{color:var(--fg);border-color:var(--accent)}
.ib{padding:14px 16px 24px}
dl.props{display:grid;grid-template-columns:120px 1fr;gap:9px 12px;margin:0}
dl.props dt{color:var(--mute)} dl.props dd{margin:0;min-width:0;word-break:break-word}
.sec{margin:20px 0 8px;font-size:11px;font-weight:500;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.code{position:relative;margin:0;padding:10px 12px;border-radius:7px;background:var(--bg);border:1px solid var(--line);font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;overflow:auto}
.code .copy{position:absolute;top:6px;right:6px;opacity:.7}
.j-k{color:#9fb4ff}.j-s{color:#8fd5a6}.j-n{color:#f5c27a}.j-b{color:#e39bd8}
.exittag{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);margin-bottom:8px}
.cause{border:1px solid #5a2a2a;background:#1d1113;border-radius:7px;overflow:hidden}
.cause.die{border-color:#6b2a2a}
.cause.intr{border-color:var(--line2);background:var(--bg)}
.cause .chd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #ffffff10}
.cause .ctag{font:500 11px var(--mono);padding:1px 6px;border-radius:4px;background:#f2554f26;color:#ff8a85}
.cause.intr .ctag{background:#8a8f9a26;color:var(--fg2)}
.cause .cname{font:600 13px var(--mono)}
.cause .cbody{padding:10px 12px}
.cause pre{margin:8px 0 0;font:11.5px/1.6 var(--mono);color:#e8b3b0;white-space:pre-wrap;word-break:break-word}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font:12px var(--mono)} .kv span:nth-child(odd){color:var(--mute)}
.atts{width:100%;border-collapse:collapse;font-size:12px}
.atts td{padding:6px 4px;border-top:1px solid var(--line)} .atts tr{cursor:pointer} .atts tr:hover td{background:var(--hover)}
.note{color:var(--fg2);font-size:12px;padding:9px 11px;border-radius:7px;background:var(--raise);border:1px solid var(--line);margin-top:14px}
.comp{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.comp .n{font:11px var(--mono);color:var(--mute);width:16px;padding-top:2px}
.lnk{color:var(--accent2)} .lnk:hover{text-decoration:underline}

/* workflows + execute */
.wfname{font-weight:600} .wfdesc{color:var(--mute);font-size:12px;white-space:normal;max-width:440px;margin-top:2px}
.t.wfs td{height:auto;padding-top:11px;padding-bottom:11px;vertical-align:top}
.ann{display:inline-block;font:11px var(--mono);padding:1px 6px;border-radius:4px;background:var(--raise);border:1px solid var(--line2);color:var(--fg2)}
.counts{display:flex;gap:4px;flex-wrap:wrap}
.counts a.pill:hover{filter:brightness(1.25)}
.exgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.card{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.card>header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:500}
.card>.cb{padding:14px}
.field{margin-bottom:14px}
.field label{display:flex;gap:6px;align-items:baseline;margin-bottom:5px;font-weight:500}
.field label .req{color:var(--fail)}
.field label .hint{margin-left:auto;color:var(--mute);font:11px var(--mono);font-weight:400}
.field .input{width:100%}
.field .err{color:#ff8a85;font-size:12px;margin-top:4px}
.field .help{color:var(--mute);font-size:11px;margin-top:4px}
.exfoot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line)}
.check{display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--fg2)}
.check input{accent-color:var(--accent)}
.keyprev{font:12px var(--mono);color:var(--fg2)} .keyprev .warn{color:var(--sus)}
.recent button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:9px 14px;cursor:pointer}
.recent button:first-child{border-top:0}
.recent button:hover{background:var(--hover)}
.recent .r1{display:flex;align-items:center;gap:8px;font-size:12px}
.recent .r2{font:11px var(--mono);color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notice{display:flex;gap:10px;padding:11px 13px;border-radius:8px;margin-bottom:14px;border:1px solid #f2a93b55;background:#f2a93b10}
.notice.err{border-color:#f2554f55;background:#f2554f10}
.notice h4{margin:0 0 3px;font-size:13px;font-weight:600}
.notice p{margin:0;color:var(--fg2)}

/* down, dialog, toast */
.down{margin:12vh auto;max-width:460px;text-align:center;padding:0 20px}
.down .ico{width:40px;height:40px;margin:0 auto 14px;border-radius:10px;display:grid;place-items:center;background:#f2554f18;color:var(--fail)}
.down h2{font-size:16px;margin:0 0 6px}
.down p{color:var(--fg2);margin:0 0 12px}
.down .code{text-align:left;margin-bottom:16px}
dialog{border:1px solid var(--line2);border-radius:10px;background:var(--raise);color:var(--fg);padding:0;width:min(460px,calc(100vw - 24px));box-shadow:0 20px 60px #0009}
dialog::backdrop{background:#05060899;backdrop-filter:blur(2px)}
.dlg-b{padding:18px 18px 4px} .dlg-b h3{margin:0 0 6px;font-size:15px} .dlg-b p{margin:0 0 12px;color:var(--fg2)}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line);margin-top:12px}
ol.cl{margin:0;padding:0;list-style:none;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
ol.cl li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line)} ol.cl li:first-child{border-top:0}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;background:var(--raise);border:1px solid var(--line2);box-shadow:0 8px 30px #0008;max-width:360px}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh}
  .side{flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand{padding:10px 10px} .brand .dot{display:block} .envbox,.navh,.sidefoot{display:none}
  .nav{display:flex} .nav a{margin:0 2px}
  main{overflow:visible}
  .topbar{padding:0 12px} .page{padding:12px}
  .search{margin-left:0;width:100%} .search .input{width:100%}
  .dh{padding:12px}
  .split{display:block}
  .gutter{display:none}
  .pane.left{max-height:none}
  .trace{min-width:0}
  :root{--treew:60%}
  .tl .ty{display:none}
  .exgrid{grid-template-columns:1fr}
  dl.props{grid-template-columns:100px 1fr}
  .dh1 .acts{margin-left:0;width:100%}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">k</div>kymo<span class="dot" id="mdot"></span></div>
    <div class="envbox" id="env"></div>
    <div class="navh">Navigate</div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot" id="sidefoot"></div>
  </aside>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="data.js"></script>
<script>
const K = window.KYMO, S = K.state, NOW = Date.parse(K.NOW);
const DOWN = new URLSearchParams(location.search).get("state") === "down";
if (DOWN) S.server.status = "down";

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const T = (s) => (s ? Date.parse(s) : null);
const short = (id) => id.slice(0, 8);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const pad = (n) => String(n).padStart(2, "0");
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function fmtDur(ms) {
  if (ms == null || isNaN(ms)) return "–";
  ms = Math.max(0, ms);
  if (ms < 1000) return Math.round(ms) + "ms";

function currentStep(e) {

      return { c: "fail", i: I.x, t: last.name, sub: `failed ×${e.activities.filter((a) => a.name === last.name).length}` };
    if (last?.status === "running") return { c: "run", i: I.act, t: last.name, sub: last.attempt > 1 ? `attempt ${last.attempt}` : "" };
    if (openChild) return { c: "run", i: I.child, t: `child · ${openChild.name}` };
    if (wait?.kind === "deferred") return { c: "sus", i: I.def, t: `waiting · ${wait.name}` };
    if (wait?.kind === "clock") return { c: "clock", i: I.clock, t: `sleeping · ${wait.name}`, sub: `wakes ${rel(wait.wakeAt)}` };
  }

    if (cause?._tag === "Fail") return { c: "fail", i: I.x, t: `Fail · ${cause.error?._tag || "Error"}`, sub: at ? `at ${at.name}` : "" };
    if (cause?._tag === "Die") return { c: "fail", i: I.x, t: `Die · ${cause.defect?.name || "defect"}` };

/* ---------- execution detail ---------- */

}

      segs: atts.map((a) => ({ s: T(a.startedAt), e: attEnd(a), st: actStatus(a, ex) })),
      children: atts.length > 1 ? atts.map((a) => ({ key: `${key}/${a.attempt}`, type: "att", name: `Attempt ${a.attempt}`, ex, a, atts, start: T(a.startedAt), end: attEnd(a), status: actStatus(a, ex), children: [] })) : [],
    });
  }

      status: done ? "done" : live ? "waiting" : "interrupted", children: [] });
  });

    const ch = D.cache[c.execution];
    items.push({ key: `${ex.id}/c/${c.execution}`, type: "child", name: c.name, ex, call: c, child: ch, start: T(c.startedAt),
      end: T(c.endedAt) ?? (ch ? execEnd(ch) : NOW), status: ch?.status || "running", children: ch ? execNodes(ch) : [] });

      $("#dlgerr").innerHTML = `<div class="notice err" style="margin:12px 0 0">${I.x}<div><h4>Interrupt failed</h4><p class="mono">${esc(err.message)}</p></div></div>`;
    }
  };
}

/* ---------- workflows ---------- */
async function viewWorkflows(tok) {
  const main = $("#main");
  main.innerHTML = topbar(`<b>Workflows</b>`) + `<div class="page"><div class="loading">${I.spin}Loading…</div></div>`;
  const all = await call("listExecutions", {});
  if (tok !== navToken) return;
  cache.list = all.slice(); renderShell(parseHash());
  $(".page", main).innerHTML = `<div class="ph"><h1>Workflows</h1><span class="mute">${S.workflows.length} registered on ${esc(S.server.app)}</span></div>
  <div class="tw"><table class="t wfs"><thead><tr><th>Workflow</th><th>Idempotency key</th><th>Annotations</th><th>Executions</th><th></th></tr></thead><tbody>
  ${S.workflows.map((w) => {
    const cn = counts(all.filter((e) => e.workflow === w.name));
    return `<tr data-wf="${esc(w.name)}"><td><div class="wfname">${esc(w.name)}</div><div class="wfdesc">${esc(w.description)}</div></td>
      <td class="mono fg2">${esc(w.idempotencyKey)}</td>
      <td>${w.annotations.length ? w.annotations.map((a) => `<span class="ann">${esc(a)}</span>`).join(" ") : '<span class="mute">—</span>'}</td>
      <td><div class="counts">${STATUSES.filter((s) => cn[s]).map((s) => `<a class="pill s-${ST[s][1]}" href="#/executions?workflow=${encodeURIComponent(w.name)}&status=${s}" title="${ST[s][0]}">${I[ST[s][2]]}${cn[s]}</a>`).join("") || '<span class="mute">none</span>'}</div></td>
      <td class="r"><a class="btn sm" href="#/workflows/${encodeURIComponent(w.name)}/execute">${I.play}Execute</a></td></tr>`;
  }).join("")}</tbody></table></div>`;
  main.querySelectorAll("tr[data-wf]").forEach((tr) => (tr.onclick = (ev) => { if (!ev.target.closest("a")) location.hash = `#/executions?workflow=${encodeURIComponent(tr.dataset.wf)}`; }));
}

/* ---------- execute ---------- */
let F = null;
const keyFields = (w) => w.idempotencyKey.split("+").map((s) => s.trim().replace(/^payload\./, ""));
function computeKey(w, p) { const fs = keyFields(w); return fs.every((f) => p[f] != null && p[f] !== "") ? fs.map((f) => p[f]).join(":") : null; }
function validate(w, p) {
  const errs = {}, props = w.payload.properties;
  for (const r of w.payload.required || []) if (p[r] == null || p[r] === "") errs[r] = "Required";
  for (const [k, v] of Object.entries(p)) {
    const s = props[k]; if (!s) { errs[k] = "Not in schema"; continue; }
    if (s.type === "integer" && !Number.isInteger(v)) errs[k] = "Must be an integer";
    else if (s.type === "string" && typeof v !== "string") errs[k] = "Must be a string";
    else if (s.enum && !s.enum.includes(v)) errs[k] = `One of ${s.enum.join(", ")}`;
    else if (s.pattern && !new RegExp(s.pattern).test(v)) errs[k] = `Doesn't match ${s.pattern}`;
    else if (s.minimum != null && v < s.minimum) errs[k] = `Must be ≥ ${s.minimum}`;
    else if (s.maxLength && v.length > s.maxLength) errs[k] = `Max ${s.maxLength} characters`;
    else if (s.format === "email" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) errs[k] = "Must be an email";
    else if (s.format === "date" && !/^\d{4}-\d{2}-\d{2}$/.test(v)) errs[k] = "Must be YYYY-MM-DD";
  }
  return errs;
}
function formPayload(w) {
  const p = {};
  for (const [k, s] of Object.entries(w.payload.properties)) {
    const v = F.values[k]; if (v === "" || v == null) continue;
    p[k] = s.type === "integer" || s.type === "number" ? (v === "" || isNaN(Number(v)) ? v : Number(v)) : v;
  }
  return p;
}
function currentPayload(w) {
  if (F.mode === "json") { try { return { p: JSON.parse(F.json || "{}") }; } catch (e) { return { err: e.message }; } }
  return { p: formPayload(w) };
}
async function viewExecute(name, q, tok) {
  const main = $("#main"), w = S.workflows.find((x) => x.name === name);
  if (!w) { main.innerHTML = topbar(`<a href="#/workflows">Workflows</a>`) + `<div class="empty"><h3>No workflow ${esc(name)}</h3></div>`; return; }
  if (!F || F.wf !== name) F = { wf: name, values: {}, mode: "form", json: "{}", discard: false, errs: {}, tried: false, notice: null };
  main.innerHTML = topbar(`<a href="#/workflows">Workflows</a><span class="sep">/</span><b>${esc(name)}</b>`) + `<div class="page"><div class="loading">${I.spin}Loading…</div></div>`;
  const recent = (await call("listExecutions", { workflow: name })).slice().sort((a, b) => T(b.startedAt) - T(a.startedAt));
  if (tok !== navToken) return;
  F.recent = recent;
  const from = q.get("from") && recent.find((e) => e.id === q.get("from"));
  if (from && !F.prefilled) { F.prefilled = true; prefill(from.payload); }
  drawExecute(w);
}
function prefill(p) {
  F.values = Object.fromEntries(Object.entries(p).map(([k, v]) => [k, String(v)]));
  F.json = JSON.stringify(p, null, 2); F.errs = {}; F.notice = null;
}
function fieldHTML(k, s, req) {
  const v = F.values[k] ?? "", err = F.errs[k], bad = err ? "bad" : "";
  const common = `class="input ${bad}" id="f_${k}" data-f="${k}" ${req ? "required" : ""}`;
  let input, hint = s.type;
  if (s.enum) { input = `<select ${common}><option value="">Select…</option>${s.enum.map((o) => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`; hint = "enum"; }
  else if (s.type === "integer" || s.type === "number") { input = `<input type="number" ${common} step="${s.type === "integer" ? 1 : "any"}" ${s.minimum != null ? `min="${s.minimum}"` : ""} value="${esc(v)}" inputmode="numeric">`; hint = `${s.type}${s.minimum != null ? ` ≥ ${s.minimum}` : ""}`; }
  else if (s.format === "email") { input = `<input type="email" ${common} value="${esc(v)}" placeholder="name@example.com" autocomplete="off">`; hint = "string · email"; }
  else if (s.format === "date") { input = `<input type="date" ${common} value="${esc(v)}">`; hint = "string · date"; }
  else if (s.maxLength > 100) { input = `<textarea ${common} rows="3" maxlength="${s.maxLength}">${esc(v)}</textarea>`; hint = `string · ≤ ${s.maxLength}`; }
  else input = `<input type="text" ${common} value="${esc(v)}" placeholder="${esc(s.examples?.[0] || "")}" autocomplete="off" spellcheck="false">`;
  const isKey = keyFields(S.workflows.find((x) => x.name === F.wf)).includes(k);
  return `<div class="field"><label for="f_${k}">${esc(k)}${req ? '<span class="req">*</span>' : ""}${isKey ? '<span class="ann" style="font-size:10px">idempotency</span>' : ""}<span class="hint">${esc(hint)}</span></label>${input}
    <div data-msg="${k}">${fieldMsg(k, s, v)}</div></div>`;
}
function fieldMsg(k, s, v) {
  const err = F.errs[k];
  return err ? `<div class="err">${esc(err)}</div>` : s.pattern ? `<div class="help">pattern <span class="mono">${esc(s.pattern)}</span></div>` : s.maxLength ? `<div class="help">${String(v ?? "").length} / ${s.maxLength}</div>` : "";
}
function keyPreviewHTML(w) {
  const { p } = currentPayload(w); const key = p ? computeKey(w, p) : null;
  if (!key) return `<span class="mute">idempotencyKey <span class="mono">${esc(w.idempotencyKey)}</span></span>`;
  const hit = F.recent?.find((e) => e.idempotencyKey === key);
  return `idempotencyKey → <b>${esc(key)}</b>${hit ? ` <span class="warn">· matches ${short(hit.id)} (${hit.status}); Execute returns it</span>` : ""}`;
}
function drawExecute(w) {
  const main = $("#main"), props = w.payload.properties, req = new Set(w.payload.required || []);
  const n = F.notice;
  const noticeHTML = !n ? "" : n.kind === "dedup"
    ? `<div class="notice" role="status"><span class="ic s-sus" style="display:inline-flex">${I.info}</span><div style="flex:1"><h4>Existing execution returned (same idempotencyKey)</h4>
       <p>${esc(w.name)} with idempotencyKey <span class="mono">${esc(n.key)}</span> already exists ${n.ex ? `and is ${pill(n.ex.status)}` : ""}. The executionId is derived from the key, so no new execution was started.</p>
       <p style="margin-top:8px"><a class="lnk" href="#/executions/${n.id}">Open execution <span class="mono">${short(n.id)}</span> →</a></p></div></div>`
    : `<div class="notice err" role="alert"><span class="ic s-fail" style="display:inline-flex">${I.x}</span><div><h4>${esc(n.title)}</h4><p class="mono">${esc(n.message)}</p></div></div>`;
  const formBody = F.mode === "form"
    ? Object.entries(props).map(([k, s]) => fieldHTML(k, s, req.has(k))).join("")
    : `<textarea class="input ${F.jsonErr ? "bad" : ""}" id="fjson" rows="12" style="width:100%;font:12px/1.55 var(--mono)" spellcheck="false">${esc(F.json)}</textarea>
       ${F.jsonErr ? `<div class="field"><div class="err">${esc(F.jsonErr)}</div></div>` : ""}${Object.keys(F.errs).length ? `<div class="field"><div class="err">${Object.entries(F.errs).map(([k, v]) => `${esc(k)}: ${esc(v)}`).join("<br>")}</div></div>` : ""}`;
  $(".page", main).innerHTML = `<div class="ph"><h1>Execute</h1>
    <select class="input" id="pickwf" aria-label="Workflow">${S.workflows.map((x) => `<option ${x.name === w.name ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></div>
  <div class="exgrid"><div>${noticeHTML}
    <form class="card" id="exform" novalidate><header>Payload<div class="seg" style="margin-left:auto"><button type="button" class="chip" data-mode="form" aria-pressed="${F.mode === "form"}">Form</button><button type="button" class="chip" data-mode="json" aria-pressed="${F.mode === "json"}">JSON</button></div></header>
      <div class="cb">${formBody}</div>
      <div class="exfoot"><label class="check"><input type="checkbox" id="fdiscard" ${F.discard ? "checked" : ""}>Discard <span class="mute">— return immediately, don't wait for the result</span></label>
        <span class="keyprev" id="keyprev" style="flex-basis:100%;order:3">${keyPreviewHTML(w)}</span>
        <button class="btn primary" id="exbtn" style="margin-left:auto">${I.play}Execute <kbd>⌘↵</kbd></button></div></form></div>
    <div>
      <div class="card recent"><header>Recent payloads <span class="mute" style="font-weight:400">${F.recent.length}</span></header>
        ${F.recent.length ? F.recent.slice(0, 6).map((e) => `<button type="button" data-pre="${e.id}"><div class="r1">${sIcon(e.status)}<span class="mono">${short(e.id)}</span><span class="mute" style="margin-left:auto">${rel(e.startedAt)}</span></div><div class="r2">${esc(JSON.stringify(e.payload))}</div></button>`).join("")
          : `<div class="cb mute">No executions yet.</div>`}</div>
      <div class="card" style="margin-top:12px"><header>${esc(w.name)}</header><div class="cb">${props_(w)}</div></div>
    </div></div>`;
  wireExecute(w);
}
const props_ = (w) => `<div class="mute" style="font-size:12px;margin-bottom:10px">${esc(w.description)}</div>` + props([
  ["Idempotency", `<span class="mono">${esc(w.idempotencyKey)}</span>`], ["Success", `<span class="mono">${esc(w.success)}</span>`],
  ["Error", `<span class="mono">${esc(w.error)}</span>`], ["Annotations", w.annotations.map((a) => `<span class="ann">${esc(a)}</span>`).join(" ") || '<span class="mute">—</span>']]);
function wireExecute(w) {
  const main = $("#main");
  $("#pickwf").onchange = (e) => (location.hash = `#/workflows/${encodeURIComponent(e.target.value)}/execute`);
  main.querySelectorAll("[data-f]").forEach((el) => (el.oninput = el.onchange = () => {
    F.values[el.dataset.f] = el.value;
    const k = el.dataset.f, s = w.payload.properties[k];
    if (F.tried) { F.errs = validate(w, formPayload(w)); el.classList.toggle("bad", !!F.errs[k]); }
    main.querySelector(`[data-msg="${k}"]`).innerHTML = fieldMsg(k, s, el.value);
    $("#keyprev").innerHTML = keyPreviewHTML(w);
  }));
  const fj = $("#fjson"); if (fj) fj.oninput = () => { F.json = fj.value; $("#keyprev").innerHTML = keyPreviewHTML(w); };
  main.querySelectorAll("[data-mode]").forEach((b) => (b.onclick = () => {
    if (b.dataset.mode === F.mode) return;
    if (b.dataset.mode === "json") { F.json = JSON.stringify(formPayload(w), null, 2); F.mode = "json"; F.jsonErr = null; }
    else { try { prefill(JSON.parse(F.json || "{}")); F.mode = "form"; F.jsonErr = null; } catch (e) { F.jsonErr = "Invalid JSON: " + e.message; } }
    drawExecute(w);
  }));
  $("#fdiscard").onchange = (e) => (F.discard = e.target.checked);
  main.querySelectorAll("[data-pre]").forEach((b) => (b.onclick = () => { prefill(F.recent.find((e) => e.id === b.dataset.pre).payload); drawExecute(w); }));
  const form = $("#exform");
  form.onsubmit = (e) => { e.preventDefault(); submitExecute(w); };
  form.onkeydown = (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitExecute(w); } };
}
async function submitExecute(w) {
  F.tried = true;
  const { p, err } = currentPayload(w);
  if (err) { F.jsonErr = "Invalid JSON: " + err; drawExecute(w); return; }
  F.jsonErr = null; F.errs = validate(w, p);
  if (Object.keys(F.errs).length) { drawExecute(w); $(".bad")?.focus(); return; }
  const b = $("#exbtn"); b.disabled = true; b.innerHTML = `${I.spin}Executing…`;
  try {
    const r = await call("execute", w.name, p, { discard: F.discard });
    if (r.deduplicated) {
      const ex = await call("getExecution", r.executionId).catch(() => null);
      F.notice = { kind: "dedup", id: r.executionId, key: computeKey(w, p), ex };
      drawExecute(w);
    } else {
      F.notice = null; F.tried = false;
      // The UI treats KYMO.NOW as "now"; align the new execution's start with it so relative times stay sane.
      const created = S.executions.find((e) => e.id === r.executionId);
      if (created) created.startedAt = K.NOW;
      cache.list = null;
      toast(`Started ${esc(w.name)} <span class="mono">${short(r.executionId)}</span>${r.discard ? " · discarded (not awaiting result)" : ""}`);
      location.hash = `#/executions/${r.executionId}`;
    }
  } catch (e) {
    F.notice = { kind: "err", title: e.error === "server_unreachable" ? `Can't reach ${S.server.app}` : "Execute failed", message: `${e.error}: ${e.message}` };
    drawExecute(w);
  }
}

/* ---------- global wiring ---------- */
document.addEventListener("click", async (ev) => {
  const cp = ev.target.closest("[data-copy]");
  if (cp) { ev.stopPropagation(); ev.preventDefault(); try { await navigator.clipboard.writeText(cp.dataset.copy); } catch {} toast(`Copied <span class="mono">${esc(cp.dataset.copy.slice(0, 40))}</span>`); return; }
  if (ev.target.closest("[data-act=retry]")) {
    const n = $("#retrynote"); if (n) n.textContent = "Retrying…";
    await route();
    const m = $("#retrynote"); if (m) m.textContent = `Still unreachable · tried ${new Date().toLocaleTimeString()}`;
  }
}, true);

(async () => {
  try { cache.list = await call("listExecutions", {}); } catch {}
  if (!location.hash) history.replaceState(null, "", "#/executions");
  route();
})();
</script>
</body>
</html>
