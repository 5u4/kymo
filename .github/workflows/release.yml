name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build:web
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apps/web/dist
          git commit --no-verify -m "release: $GITHUB_SHA"
          for _ in 1 2 3 4 5; do
            tip=
            if git fetch -q origin +refs/heads/release:refs/remotes/origin/release; then
              tip=$(git rev-parse refs/remotes/origin/release)
              if git merge-base --is-ancestor "$GITHUB_SHA" "$tip^"; then
                echo "release already includes $GITHUB_SHA; not publishing"
                exit 0
              fi
            fi
            git push --force-with-lease="refs/heads/release:$tip" origin HEAD:refs/heads/release && exit 0
          done
          exit 1
